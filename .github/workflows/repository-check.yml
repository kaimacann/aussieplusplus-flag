name: Repository check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check quality
        run: pnpm run quality
      - name: Require committed quality fixes
        run: git diff --exit-code
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm run test
